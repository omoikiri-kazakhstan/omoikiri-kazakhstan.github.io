<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index, follow"><title>OMOIKIRI Казахстан</title><style>body{margin:0;background:#f2f2f1;color:#191919;font-family:Arial,sans-serif}.head{height:92px;background:#fff;border-bottom:1px solid #ddd;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(24px,7vw,110px);font-weight:800;letter-spacing:1px}.head a{color:#191919;text-decoration:none}.product{min-height:calc(100vh - 92px);display:grid;grid-template-columns:1fr 1fr;gap:clamp(30px,8vw,130px);padding:clamp(40px,9vw,140px) clamp(24px,9vw,160px);align-items:center}.image{width:100%;max-height:560px;object-fit:contain}.eyebrow{color:#666;font-size:14px}.name{font-size:clamp(34px,5vw,72px);margin:8px 0}.price{display:inline-block;background:#222;color:#fff;padding:13px 20px;border-radius:24px;font-size:24px;font-weight:700}.price del{font-size:16px;color:#f31c45;margin-right:8px}.description{max-width:600px;line-height:1.55;font-size:17px;white-space:pre-line;margin-top:30px}@media(max-width:700px){.product{grid-template-columns:1fr;padding-top:50px}.head{height:70px}}</style></head><body><header class="head"><a href="/">OMOIKIRI <small>КАЗАХСТАН</small></a><a id="back" href="/sinks/">В каталог</a></header><main id="product" class="product">Загрузка позиции...</main><script>const slug=new URLSearchParams(location.search).get('product');const root=document.getElementById('product');const esc=(v)=>{const e=document.createElement('i');e.textContent=v||'';return e.innerHTML};fetch('/api/catalog').then(r=>r.json()).then(({items})=>{const item=items.find(x=>x.slug===slug&&x.isCustom&&x.visible);if(!item){root.textContent='Позиция не найдена.';return}document.title=`${item.name} | OMOIKIRI Казахстан`;document.getElementById('back').href=`/${item.category}/`;root.innerHTML=`<img class="image" src="${esc(item.imageUrl)}" alt="${esc(item.name)}"><section><p class="eyebrow">${esc(item.sku ? `арт. ${item.sku}` : '')}</p><h1 class="name">${esc(item.name)}</h1><div class="price">${item.oldPrice?`<del>${Number(item.oldPrice).toLocaleString('ru-RU')} ₸</del>`:''}${item.price?Number(item.price).toLocaleString('ru-RU')+' ₸':'Цена по запросу'}</div><p class="description">${esc(item.description)}</p></section>`}).catch(()=>{root.textContent='Не удалось загрузить позицию.'})</script></body></html>
