<!doctype html>
<html lang="ru-RU">
<head>
<meta charset="UTF-8">
  <meta name="robots" content="noindex">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Корзина - OMOIKIRI KZ</title>
  <link rel="canonical" href="https://omoikiri.kz/cart" />

  <link rel="stylesheet" href="/assets/remote/omoikiri.ru/wp-content/themes/twentynineteen/styles/index.css">
  <link rel="stylesheet" href="/assets/remote/omoikiri.ru/wp-content/themes/twentynineteen/styles/menu.css">
  <link rel="stylesheet" href="/assets/remote/omoikiri.ru/wp-content/themes/twentynineteen/styles/default.css">
  <link rel="stylesheet" href="/assets/remote/omoikiri.ru/wp-content/themes/twentynineteen/styles/main.css">
  <link rel="stylesheet" href="/assets/remote/omoikiri.ru/wp-content/themes/twentynineteen/styles/buttons.css">
  <style>
    body {
      background: #fff;
      color: #111;
      font-family: Arial, sans-serif;
    }

    .dealer-cart-page {
      min-height: 100vh;
      padding: 120px 6vw 70px;
    }

    .dealer-cart-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 28px;
      margin-bottom: 46px;
      border-bottom: 1px solid rgba(0, 0, 0, .14);
      padding-bottom: 28px;
    }

    .dealer-cart-head h1 {
      margin: 0;
      font-size: clamp(44px, 8vw, 118px);
      font-weight: 400;
      line-height: .9;
      text-transform: uppercase;
    }

    .dealer-cart-head a,
    .dealer-cart-checkout,
    .dealer-cart-clear {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0 18px;
      border: 1px solid #111;
      border-radius: 999px;
      background: #111;
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .04em;
      text-transform: uppercase;
      cursor: pointer;
    }

    .dealer-cart-clear {
      background: #fff;
      color: #111;
    }

    .dealer-cart-note {
      display: none;
    }

    .dealer-cart-payment {
      display: none;
    }

    .dealer-cart-list {
      display: grid;
      gap: 12px;
    }

    .dealer-cart-row {
      display: grid;
      grid-template-columns: 104px 1fr auto auto auto;
      gap: 22px;
      align-items: center;
      padding: 18px;
      border: 1px solid rgba(0, 0, 0, .12);
      background: #fff;
    }

    .dealer-cart-row img {
      width: 104px;
      height: 104px;
      object-fit: contain;
      background: #f7f7f7;
    }

    .dealer-cart-row h2 {
      margin: 0 0 8px;
      font-size: 24px;
      font-weight: 400;
    }

    .dealer-cart-row p {
      margin: 0;
      color: #666;
    }

    .dealer-cart-stepper {
      display: inline-grid;
      grid-template-columns: 36px 42px 36px;
      align-items: center;
      min-height: 36px;
      border: 1px solid #d7d7d7;
      border-radius: 999px;
      overflow: hidden;
      text-align: center;
    }

    .dealer-cart-stepper button {
      height: 36px;
      border: 0;
      background: #fff;
      cursor: pointer;
      font-size: 18px;
    }

    .dealer-cart-remove {
      border: 0;
      background: transparent;
      color: #111;
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .04em;
      text-transform: uppercase;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .dealer-cart-total {
      display: grid;
      grid-template-columns: 1fr auto auto auto;
      align-items: center;
      gap: 20px;
      margin-top: 30px;
      padding-top: 24px;
      border-top: 1px solid rgba(0, 0, 0, .14);
      font-size: 24px;
    }

    .dealer-cart-empty {
      padding: 42px;
      border: 1px dashed rgba(0, 0, 0, .25);
      color: #777;
    }

    .dealer-checkout-form {
      max-width: 760px;
      margin-top: 30px;
      padding-top: 28px;
      border-top: 1px solid rgba(0, 0, 0, .14);
    }

    .dealer-checkout-form[hidden] { display: none; }
    .dealer-checkout-form h2 { margin: 0 0 18px; font-size: 26px; }
    .dealer-checkout-fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
    .dealer-checkout-form label { display: grid; gap: 7px; font-size: 14px; font-weight: 700; }
    .dealer-checkout-form input:not([type="checkbox"]),
    .dealer-checkout-form textarea {
      width: 100%;
      min-height: 44px;
      padding: 10px 12px;
      border: 1px solid #aaa;
      border-radius: 2px;
      background: #fff;
      color: #111;
      font: inherit;
    }
    .dealer-checkout-form textarea { min-height: 90px; resize: vertical; }
    .dealer-checkout-wide { grid-column: 1 / -1; }
    .dealer-checkout-form .dealer-checkout-consent { display: flex; align-items: flex-start; gap: 9px; margin: 20px 0; font-weight: 400; }
    .dealer-checkout-consent input { margin-top: 3px; }
    .dealer-checkout-form button { min-height: 44px; padding: 0 24px; border: 0; background: #111; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    .dealer-checkout-form button:disabled, .dealer-cart-checkout:disabled { opacity: .45; cursor: not-allowed; }
    .dealer-checkout-status { margin: 16px 0 0; line-height: 1.5; }
    .dealer-checkout-status[data-state="error"] { color: #b00020; }
    .dealer-checkout-form.is-complete .dealer-checkout-fields,
    .dealer-checkout-form.is-complete .dealer-checkout-consent,
    .dealer-checkout-form.is-complete #checkout-turnstile,
    .dealer-checkout-form.is-complete #checkout-submit { display: none; }

    .dealer-cart-payment {
      margin-top: 42px;
      padding: 24px;
      background: #f5f5f5;
      color: #333;
      line-height: 1.5;
    }

    @media (max-width: 760px) {
      .dealer-cart-page {
        padding: 28px 16px calc(72px + env(safe-area-inset-bottom));
      }

      .dealer-cart-head {
        display: grid;
        gap: 20px;
        margin-bottom: 24px;
        padding-bottom: 22px;
      }

      .dealer-cart-head h1 {
        font-size: 38px;
        line-height: 1;
      }

      .dealer-cart-head a {
        width: max-content;
        max-width: 100%;
        background: #fff;
        color: #111;
      }

      .dealer-cart-row {
        grid-template-columns: 76px minmax(0, 1fr);
        gap: 10px 14px;
        padding: 12px;
      }

      .dealer-cart-row > div:first-of-type {
        grid-column: 2;
        grid-row: 1;
        min-width: 0;
      }

      .dealer-cart-row h2 {
        font-size: 17px;
        line-height: 1.25;
        overflow-wrap: anywhere;
      }

      .dealer-cart-row p {
        font-size: 13px;
        line-height: 1.4;
        overflow-wrap: anywhere;
      }

      .dealer-cart-row > strong {
        grid-column: 2;
        grid-row: 2;
        justify-self: start;
        font-size: 17px;
        white-space: nowrap;
      }

      .dealer-cart-stepper {
        grid-column: 1;
        grid-row: 3;
        width: max-content;
      }

      .dealer-cart-remove {
        grid-column: 2;
        grid-row: 3;
        justify-self: end;
        min-height: 44px;
      }

      .dealer-cart-row img {
        grid-column: 1;
        grid-row: 1 / span 2;
        width: 76px;
        height: 76px;
      }

      .dealer-cart-total {
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 14px;
        margin-top: 24px;
        font-size: 20px;
      }

      .dealer-cart-clear {
        grid-column: 1 / -1;
        justify-self: start;
      }

      .dealer-cart-checkout {
        grid-column: 1 / -1;
        width: 100%;
        min-height: 48px;
      }

      .dealer-cart-empty {
        display: grid;
        min-height: 140px;
        place-items: center;
        padding: 24px;
        text-align: center;
      }

      .dealer-checkout-form {
        margin-top: 24px;
        padding-top: 24px;
      }

      .dealer-checkout-fields { grid-template-columns: 1fr; }
      .dealer-checkout-wide { grid-column: auto; }
      .dealer-checkout-form button { width: 100%; }
      body:has(.dealer-cart-page) .dealer-local-cart-tab { display: none !important; }
    }
  </style>
</head>
<body>
  <main class="dealer-cart-page">
    <header class="dealer-cart-head">
      <div>
        <h1>Корзина</h1>
      </div>
      <a href="./index.html">Вернуться на сайт</a>
    </header>

    <p class="dealer-cart-note">
      Стоимость товаров указана в тенге. Доставка в итоговую сумму не включена и согласовывается отдельно.
    </p>

    <div class="dealer-cart-list" id="cart-list"></div>

    <div class="dealer-cart-total">
      <span>Итого</span>
      <strong id="cart-total">0 ₸</strong>
      <button class="dealer-cart-clear" type="button" id="cart-clear">Очистить</button>
      <button class="dealer-cart-checkout" type="button">Оформить заказ</button>
    </div>

    <form class="dealer-checkout-form" id="checkout-form" hidden>
      <h2>Контактные данные</h2>
      <div class="dealer-checkout-fields">
        <label>Ваше имя<input name="name" autocomplete="name" maxlength="100" required></label>
        <label>Телефон<input name="phone" type="tel" autocomplete="tel" inputmode="tel" maxlength="32" placeholder="+7 777 123 45 67" required></label>
        <label>Город<input name="city" autocomplete="address-level2" maxlength="100" required></label>
        <label>Адрес доставки, если нужен<input name="address" autocomplete="street-address" maxlength="200"></label>
        <label class="dealer-checkout-wide">Комментарий<textarea name="comment" maxlength="500" placeholder="Удобное время для звонка, пожелания по заказу"></textarea></label>
      </div>
      <label class="dealer-checkout-consent"><input name="consent" type="checkbox" required><span>Согласен на обработку контактных данных для оформления заказа.</span></label>
      <div id="checkout-turnstile"></div>
      <button id="checkout-submit" type="submit">Отправить заказ</button>
      <p class="dealer-checkout-status" id="checkout-status" role="status" aria-live="polite"></p>
    </form>

    <section class="dealer-cart-payment">
      <strong>Оплата:</strong> способ оплаты согласуем при подтверждении заказа.
    </section>
  </main>

  <script>
    const discontinuedSkus = new Set([
      '4993469', '4993459', '4993487', '4993744', '4993291',
      '4993935', '4993845', '4993875', '4993917', '4993247',
      '4993508', '4973056', '4994174', '4994139', '4994270',
      '4993342', '4993335', '4993416', '4993886', '4993562',
      '4993567', '4997264', '4973080', '4994365'
    ]);

    const products = [
      {
        id: 'akisame-100-2-r-gm',
        name: 'Akisame 100-2-R',
        detail: 'Цвет: графит',
        price: 615880,
        image: '/assets/remote/omoikiri.ru/wp-content/uploads/2024/10/akisame-100-2-r-gm.png'
      },
      {
        id: 'akisame-100-2-r-in',
        name: 'Akisame 100-2-R',
        detail: 'Цвет: нержавеющая сталь',
        price: 434880,
        image: '/assets/remote/omoikiri.ru/wp-content/uploads/2024/10/akisame-100-2-r-in.png'
      }
    ];

    function money(value) {
      return new Intl.NumberFormat('ru-KZ').format(value) + ' ₸';
    }

    function localizeImage(value) {
      return String(value || '').replace(/^https?:\/\/omoikiri\.ru(?=\/)/i, '/assets/remote/omoikiri.ru');
    }

    function escapeHtml(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function cleanColorName(value) {
      const normalized = String(value || '')
        .replace(/^\s*\d+\.\s*/, '')
        .replace(/\s+/g, ' ')
        .trim();
      const colorAliases = {
        'azur blue': 'азурно-голубой',
        'indigo blue': 'индиго',
        'leningrad grey': 'ленинградский серый',
        'royal green / светлое золото': 'королевский зеленый / светлое золото',
        'sicilian lemon': 'сицилийский лимон',
        'toscana': 'тоскана',
        'espresso': 'эспрессо'
      };
      return colorAliases[normalized.toLowerCase()] || normalized;
    }

    function normalizeDetail(value) {
      return String(value || '').replace(/Цвет:\s*([^·]+)/i, (_, color) => 'Цвет: ' + cleanColorName(color));
    }

    function readCart() {
      let stored;
      try { stored = JSON.parse(localStorage.getItem('omoikiriCart') || 'null'); } catch { stored = null; }
      if (Array.isArray(stored) && stored.length) {
        const available = stored.filter((item) => !discontinuedSkus.has(String(item?.article || item?.sku || '').trim()));
        if (available.length !== stored.length) localStorage.setItem('omoikiriCart', JSON.stringify(available));
        return available;
      }
      return [];
    }

    let cart = readCart();

    async function refreshCartPrices() {
      const response = await fetch('/api/prices', { cache: 'no-store' });
      if (!response.ok) throw new Error('Не удалось проверить актуальные цены. Попробуйте позже.');
      const { bySku = {}, bySlug = {} } = await response.json();
      let changed = false;
      for (const item of cart) {
        const sku = String(item.article || item.sku || '');
        const rub = Number(bySku[sku] || bySlug[item.slug]?.default?.rub);
        if (!rub) continue;
        const price = Math.ceil((rub * 6.1 - 880) / 1000) * 1000 + 880;
        if (Number(item.price) !== price) {
          item.price = price;
          changed = true;
        }
      }
      if (changed) {
        saveCart();
        renderCart();
      }
      return changed;
    }

    function updateCartCount() {
      const count = cart.reduce((sum, item) => sum + (Number(item?.qty) || 0), 0);
      document.querySelectorAll('#cart-count, .cart-count, [data-cart-count]').forEach((node) => {
        node.textContent = String(count);
        node.toggleAttribute('data-count-zero', count === 0);
      });
    }

    function saveCart() {
      localStorage.setItem('omoikiriCart', JSON.stringify(cart));
      updateCartCount();
    }

    function changeQty(id, delta) {
      const item = cart.find((entry) => entry.id === id);
      if (!item) return;
      item.qty += delta;
      cart = cart.filter((entry) => entry.qty > 0);
      saveCart();
      renderCart();
    }

    function removeCartItem(id) {
      cart = cart.filter((entry) => entry.id !== id);
      saveCart();
      renderCart();
    }

    function renderCart() {
      const list = document.querySelector('#cart-list');
      if (!cart.length) {
        list.innerHTML = '<div class="dealer-cart-empty">Корзина пуста.</div>';
      } else {
        list.innerHTML = cart.map((item) => {
          const product = products.find((entry) => entry.id === item.id) || item;
          if (!product) return '';
          const article = product.article || product.sku || '';
          const details = [
            article ? 'арт. ' + article : '',
            normalizeDetail(product.detail || product.color || ''),
            product.price ? money(Number(product.price)) : ''
          ].filter(Boolean).join(' · ');
          const productName = product.name || product.title || 'OMOIKIRI';
          const safeProductName = escapeHtml(productName);
          const safeDetails = escapeHtml(details);
          const safeImage = escapeHtml(localizeImage(product.image));
          const safeFallbackImage = '/assets/remote/omoikiri.ru/wp-content/themes/twentynineteen/img/default/logo_black.svg';
          const safeId = escapeHtml(item.id);
          return `
            <article class="dealer-cart-row">
              <img src="${safeImage}" data-fallback-src="${safeFallbackImage}" alt="${safeProductName}">
              <div>
                <h2>${safeProductName}</h2>
                <p>${safeDetails}</p>
              </div>
              <div class="dealer-cart-stepper">
                <button type="button" data-cart-id="${safeId}" data-delta="-1">-</button>
                <span>${item.qty}</span>
                <button type="button" data-cart-id="${safeId}" data-delta="1">+</button>
              </div>
              <button class="dealer-cart-remove" type="button" data-remove-cart-id="${safeId}" aria-label="Удалить ${safeProductName}">Удалить</button>
              <strong>${money(Number(product.price || 0) * item.qty)}</strong>
            </article>
          `;
        }).join('');
      }

      const total = cart.reduce((sum, item) => {
        const product = products.find((entry) => entry.id === item.id) || item;
        return sum + (Number(product.price || 0) * item.qty);
      }, 0);

      document.querySelector('#cart-total').textContent = money(total);
      document.querySelector('.dealer-cart-checkout').disabled = cart.length === 0;
      if (!cart.length) document.querySelector('#checkout-form').hidden = true;
      document.querySelectorAll('.dealer-cart-row img[data-fallback-src]').forEach((image) => {
        image.addEventListener('error', () => {
          const fallback = image.dataset.fallbackSrc || '';
          if (fallback && image.src !== fallback) image.src = fallback;
        }, { once: true });
      });
      document.querySelectorAll('[data-cart-id]').forEach((button) => {
        button.addEventListener('click', () => changeQty(button.dataset.cartId, Number(button.dataset.delta)));
      });
      document.querySelectorAll('[data-remove-cart-id]').forEach((button) => {
        button.addEventListener('click', () => removeCartItem(button.dataset.removeCartId));
      });
    }

    document.querySelector('#cart-clear').addEventListener('click', () => {
      if (cart.length && !window.confirm('Очистить корзину?')) return;
      cart = [];
      saveCart();
      renderCart();
    });

    const checkoutForm = document.querySelector('#checkout-form');
    const checkoutStatus = document.querySelector('#checkout-status');
    const checkoutButton = document.querySelector('#checkout-submit');
    let checkoutRequestId = '';
    let turnstileWidgetId = null;
    const checkoutMessage = (ru, kz) => localStorage.getItem('omoikiriDealerLang') === 'kz' ? kz : ru;

    function completeCheckout(message) {
      cart = [];
      saveCart();
      renderCart();
      checkoutForm.reset();
      checkoutForm.classList.add('is-complete');
      checkoutRequestId = '';
      checkoutStatus.dataset.state = '';
      checkoutStatus.textContent = message;
      checkoutForm.hidden = false;
    }

    async function ensurePaymentWidget() {
      if (window.tiptop?.Widget) return;
      await new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = 'https://widget.tiptoppay.kz/bundles/widget.js';
        script.onload = resolve;
        script.onerror = reject;
        document.head.appendChild(script);
      });
      if (!window.tiptop?.Widget) throw new Error('Не удалось открыть форму оплаты. Попробуйте позже.');
    }

    async function waitForPayment(requestId) {
      for (let attempt = 0; attempt < 15; attempt++) {
        const response = await fetch(`/api/orders/payment?requestId=${encodeURIComponent(requestId)}`, { cache: 'no-store' });
        if (!response.ok) throw new Error('Не удалось проверить статус оплаты. Свяжитесь с нами перед повторной оплатой.');
        const result = await response.json();
        if (result.paymentStatus === 'paid') return result;
        if (result.paymentStatus === 'expired') break;
        await new Promise((resolve) => setTimeout(resolve, 1500));
      }
      return null;
    }

    async function ensureTurnstile() {
      if (turnstileWidgetId !== null) return;
      if (!window.turnstile) {
        await new Promise((resolve, reject) => {
          const script = document.createElement('script');
          script.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';
          script.async = true;
          script.onload = resolve;
          script.onerror = reject;
          document.head.appendChild(script);
        });
      }
      turnstileWidgetId = window.turnstile.render('#checkout-turnstile', { sitekey: '0x4AAAAAAFR_mTc93kitTTkd' });
    }

    document.querySelector('.dealer-cart-checkout').addEventListener('click', () => {
      if (!cart.length) return;
      checkoutForm.classList.remove('is-complete');
      checkoutForm.hidden = false;
      checkoutForm.querySelector('[name="name"]').focus();
      checkoutForm.scrollIntoView({ behavior: 'smooth', block: 'start' });
      ensureTurnstile().catch(() => {
        checkoutStatus.dataset.state = 'error';
        checkoutStatus.textContent = checkoutMessage('Не удалось загрузить проверку отправки. Обновите страницу.', 'Тексеруді жүктеу мүмкін болмады. Бетті жаңартыңыз.');
      });
    });

    checkoutForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (!cart.length || checkoutButton.disabled) return;
      try {
        if (await refreshCartPrices()) {
          checkoutStatus.dataset.state = 'error';
          checkoutStatus.textContent = 'Цена в корзине обновилась. Проверьте сумму и нажмите «Оформить заказ» ещё раз.';
          return;
        }
      } catch (error) {
        checkoutStatus.dataset.state = 'error';
        checkoutStatus.textContent = error.message;
        return;
      }
      const turnstileToken = turnstileWidgetId === null ? '' : window.turnstile.getResponse(turnstileWidgetId);
      if (!turnstileToken) {
        checkoutStatus.dataset.state = 'error';
        checkoutStatus.textContent = checkoutMessage('Дождитесь проверки отправки и попробуйте снова.', 'Тексеру аяқталғанша күтіп, қайта байқап көріңіз.');
        return;
      }
      const fields = new FormData(checkoutForm);
      checkoutRequestId ||= crypto.randomUUID();
      const items = cart.map((entry) => {
        const product = products.find((candidate) => candidate.id === entry.id) || entry;
        return {
          id: String(entry.id || ''),
          slug: String(entry.slug || (entry.href ? new URL(entry.href, location.href).pathname.split('/').filter(Boolean).at(-1) : '')),
          name: String(product.name || product.title || ''),
          sku: String(product.article || product.sku || ''),
          color: normalizeDetail(product.detail || product.color || ''),
          qty: Number(entry.qty),
          price: Number(product.price)
        };
      });
      checkoutButton.disabled = true;
      checkoutStatus.dataset.state = '';
      checkoutStatus.textContent = checkoutMessage('Отправляем заказ...', 'Тапсырыс жіберілуде...');
      try {
        const response = await fetch('/api/orders/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            requestId: checkoutRequestId,
            name: fields.get('name'), phone: fields.get('phone'),
            city: fields.get('city'), address: fields.get('address'),
            comment: fields.get('comment'), consent: fields.get('consent') === 'on', turnstileToken, items
          })
        });
        const result = await response.json();
        if (!response.ok || !result.ok) throw new Error(result.error || 'Не удалось отправить заказ.');
        if (result.paymentStatus === 'paid') {
          completeCheckout(result.paymentTestMode ? 'Тестовая оплата подтверждена. Реального списания не было.' : checkoutMessage(`Заказ №${result.orderId} оплачен. Мы свяжемся с вами по доставке.`, `№${result.orderId} тапсырыс төленді. Жеткізу бойынша хабарласамыз.`));
        } else if (result.payment) {
          checkoutStatus.textContent = checkoutMessage('Открываем безопасную форму оплаты...', 'Қауіпсіз төлем формасын ашудамыз...');
          await ensurePaymentWidget();
          const widgetResult = await new window.tiptop.Widget().start(result.payment);
          if (widgetResult?.status === 'success') {
            checkoutStatus.textContent = checkoutMessage('Проверяем подтверждение оплаты...', 'Төлем расталуын тексерудеміз...');
            const payment = await waitForPayment(checkoutRequestId);
            if (payment) {
              completeCheckout(payment.paymentTestMode ? 'Тестовая оплата подтверждена. Реального списания не было.' : checkoutMessage(`Заказ №${result.orderId} оплачен. Мы свяжемся с вами по доставке.`, `№${result.orderId} тапсырыс төленді. Жеткізу бойынша хабарласамыз.`));
            } else {
              checkoutStatus.textContent = checkoutMessage(`Платёж №${result.orderId} ещё подтверждается. Не оплачивайте повторно; свяжитесь с нами, если статус не изменится.`, `№${result.orderId} төлемі әлі расталуда. Қайта төлемеңіз; мәртебе өзгермесе, бізге хабарласыңыз.`);
            }
          } else {
            checkoutStatus.textContent = checkoutMessage('Оплата не завершена. Товары остались в корзине, можно попробовать снова.', 'Төлем аяқталмады. Тауарлар себетте қалды, қайта көріңіз.');
          }
        } else if (result.paymentStatus === 'processing') {
          checkoutStatus.textContent = checkoutMessage(`Оплата заказа №${result.orderId} обрабатывается. Не оплачивайте повторно; свяжитесь с нами, если статус не изменится.`, `№${result.orderId} тапсырысының төлемі өңделуде. Қайта төлемеңіз; мәртебе өзгермесе, бізге хабарласыңыз.`);
        } else if (result.paymentStatus === 'not_required') {
          completeCheckout(checkoutMessage(`Заказ №${result.orderId} принят. Мы свяжемся с вами для подтверждения доставки.`, `№${result.orderId} тапсырыс қабылданды. Жеткізу бойынша хабарласамыз.`));
        } else {
          throw new Error('Статус оплаты не получен. Свяжитесь с нами перед повторной оплатой.');
        }
      } catch (error) {
        checkoutStatus.dataset.state = 'error';
        checkoutStatus.textContent = checkoutMessage(error.message || 'Не удалось отправить заказ. Попробуйте ещё раз.', 'Тапсырысты жіберу мүмкін болмады. Қайта байқап көріңіз немесе бізге қоңырау шалыңыз.');
      } finally {
        if (turnstileWidgetId !== null) window.turnstile.reset(turnstileWidgetId);
        checkoutButton.disabled = false;
      }
    });

    renderCart();
    updateCartCount();
    refreshCartPrices().catch(() => {});
  </script>
